# Part A source configuration (owner: A).
#
# Every entry records WHERE its URL / layer / attribute names come from (`source:`).
# "spike 2026-11-21" means: observed in a live response by scripts/a/spike_sources.py (or the manual
# probes that preceded it) on 2026-11-21. Re-run the spike to re-verify.
#
# Licence fields:
#   licence_declared: text the service itself declares (capabilities Fees/AccessConstraints) - verified.
#   licence / attribution_pl with `licence_verified: false`: taken from the provider's licence page named in
#   `licence_source`, NOT yet re-read during this hackathon -> must be checked before docs/DATA_SOURCES.md (CP5).

spike:
  # Test points used by the spike (lon, lat, WGS84). Chosen only to exercise the services; any point in
  # Poland works. Not used by the provider.
  points:
    kujawy_inowroclaw: [18.30, 52.80]
    wielkopolska_wrzesnia: [17.62, 52.30]
    lubelskie_hrubieszow: [23.80, 50.82]
  timeout_s: 240

uldk:
  name: ULDK GUGiK
  url: https://uldk.gugik.gov.pl/
  source: https://uldk.gugik.gov.pl/ ; spike 2026-11-21
  requests: [GetParcelById, GetParcelByIdOrNr, GetParcelByXY]
  result_fields: id,geom_wkt,teryt,voivodeship,county,commune,region,parcel
  srid_param: srid              # srid=4326 or srid=2180 -> geometry returned as "SRID=<n>;POLYGON((...))"
  xy_format: "{lon},{lat},4326" # spike: xy=18.30,52.80,4326 returned parcel 040704_2.0012.63/1 at 52.80N 18.30E
  response_format: >-
    Plain text. Line 1 = status: "0" ok; "-1 brak wyników" when nothing found; for GetParcelByIdOrNr a
    number (count of records). Following lines = one record each, fields separated by "|" in the order
    of `result`. Invalid input can return an SQL error text after "-1" -> treat as no result.
  observed_latency_s: 0.3
  licence_declared: null
  licence: Dane PZGiK udostępniane bez opłat
  licence_verified: false
  licence_source: https://www.geoportal.gov.pl/ (warunki korzystania z usług GUGiK)
  attribution_pl: null          # exact required text to be taken from licence_source (CP5)

soil_map:
  name: Mapa glebowo-rolnicza (GUGiK, WMS)
  url: https://mapy.geoportal.gov.pl/wss/service/pub/guest/MapaGlebowoRolnicza/MapServer/WMSServer
  source: https://www.geoportal.gov.pl/aktualnosci/usluga-wms-prezentujaca-mape-glebowo-rolnicza-dostepna-w-serwisie-www-geoportal-gov-pl/ ; GetCapabilities spike 2026-11-21
  wms_version: "1.3.0"
  crs: EPSG:2180                # WMS 1.3.0 + EPSG:2180 -> BBOX axis order is (northing, easting)
  layers:
    "0": KONTURY_GLEBOWE         # soil contours: the layer that answers GetFeatureInfo with attributes
    "1": ZASIEG_KONTUROW_GLEBOWYCH  # extent of mapped contours (no useful attributes at a point)
    "2": ODKRYWKI_GLEBOWE        # soil pits (points; usually no hit at a parcel)
  query_layer: "0"
  info_format: text/xml          # spike: application/json -> ServiceException InvalidFormat
  response_encoding: UTF-8          # spike: PODLOZE1 bytes C5 82 = "ł" in UTF-8 ("płi") (garbled text seen earlier was the Windows console)
  attributes:                    # names exactly as returned in <FIELDS ...> (spike 2026-11-21)
    complex: KOMPLEKS            # agricultural soil complex code, e.g. "1", "4", "5", "1z", "Ls", "W", "Tnk"
    type_subtype: TYPPODTYP      # soil type/subtype code, e.g. "D", "C", "Bw", "Dz", "F"
    texture_layers: [PODLOZE1, PODLOZE2, PODLOZE3, PODLOZE4, PODLOZE5]   # gatunek per layer, top first, e.g. "pgl", "glp", "gl", "li"
    thickness_markers: [MIAZSZOSC1, MIAZSZOSC2, MIAZSZOSC3, MIAZSZOSC4, MIAZSZOSC5]
    alluvial_texture: [GATUNEKMADY1, GATUNEKMADY2, GATUNEKMADY3, GATUNEKMADY4, GATUNEKMADY5]   # mady, e.g. "c", "bc"
    rendzina_texture: [GATUNEKREDZINY1, GATUNEKREDZINY2, GATUNEKREDZINY3, GATUNEKREDZINY4, GATUNEKREDZINY5]
    organic_kind: [RODZAJGLEBYORGANICZNEJ1, RODZAJGLEBYORGANICZNEJ2, RODZAJGLEBYORGANICZNEJ3, RODZAJGLEBYORGANICZNEJ4, RODZAJGLEBYORGANICZNEJ5]
    source_map: ZRODLO           # e.g. "Mgr5000", "EGiB"
    currency_date: AKTUALNOSC_NR # ISO date of the source map, or "missing"
    remarks: UWAGI
  null_values: ["Null", "missing"]
  observed_latency_s: 0.1-3.2
  licence_declared: "Fees: no conditions apply; AccessConstraints: otherRestrictions (WMS GetCapabilities)"
  resolution: "1:5000"
  attribution_pl: null          # exact required text to be taken from licence_source (CP5)
  licence_verified: false
  licence_source: https://www.geoportal.gov.pl/

iung_drought_susceptibility_wms:
  name: IUNG «Podatność gleb na susze» (WMS)
  url: null                      # NOT FOUND during the spike: announced in the geoportal «Rolnictwo» module, but its URL is
                                 # not printed on the announcement page nor listed on the geoportal WMS/WMTS services page.
  source: https://www.geoportal.gov.pl/aktualnosci/nowa-usluga-wms-podatnosc-gleb-na-susze-dostepna-w-serwisie-www-geoportal-gov-pl-w-module-rolnictwo/
  status: not_found

soilgrids_rest:
  name: SoilGrids 2.0 (ISRIC) REST API
  url: https://rest.isric.org/soilgrids/v2.0/properties/query
  source: https://rest.isric.org/soilgrids/v2.0/docs ; spike 2026-11-21
  properties: [sand, silt, clay, soc, bdod, wv0033, wv1500]
  depths: [0-5cm, 5-15cm, 15-30cm, 30-60cm, 60-100cm, 100-200cm]
  values: ["Q0.05", "Q0.5", "Q0.95", mean]
  # Integer values must be divided by d_factor (returned per property in `unit_measure`; spike 2026-11-21):
  d_factor:
    bdod: 100     # cg/cm3 -> kg/dm3
    clay: 10      # g/kg -> %
    sand: 10      # g/kg -> %
    silt: 10      # g/kg -> %
    soc: 10       # dg/kg -> g/kg
    wv0033: 10    # (10^-2 cm3/cm3)*10 -> 10^-2 cm3/cm3 (i.e. vol. %) ; divide by 100 more for m3/m3
    wv1500: 10    # same as wv0033
  observed_latency_s: 163        # one point, all properties: 163 s once; other attempts: timeout at 60 s, HTTP 504 after 180 s
  rate_limit_note: "beta service, fair use (PART_A_DATA_GEO.md says 5 calls/min) -> one call per point, cache forever"
  licence: CC BY 4.0
  licence_verified: false
  licence_source: https://www.isric.org/explore/soilgrids/faq-soilgrids
  attribution_pl: null          # ISRIC asks to cite Poggio et al. 2021 (SOIL 7, 217-240); exact text in CP5

soilgrids_files:
  name: SoilGrids 2.0 (ISRIC) VRT/COG files
  url: https://files.isric.org/soilgrids/latest/data/
  source: directory listing https://files.isric.org/soilgrids/latest/data/ ; spike 2026-11-21
  path_template: "{prop}/{prop}_{depth}_{value}.vrt"   # spike: sand/sand_0-5cm_Q0.5.vrt -> value 710 (same as REST)
  available_properties: [bdod, cec, cfvo, clay, landmask, nitrogen, ocd, ocs, phh2o, sand, silt, soc, wrb]
  missing_properties: [wv0033, wv1500]   # not in the listing (404) -> water retention only via REST
  crs: Interrupted Goode Homolosine (from the file)
  resolution: "250 m"
  nodata: -32768
  observed_latency_s: 77-291     # first open of one VRT; at 52.80N 18.30E sand_0-5cm_Q0.5 returned nodata (-32768)
  licence: CC BY 4.0             # same dataset as soilgrids_rest
  licence_verified: false
  licence_source: https://www.isric.org/explore/soilgrids/faq-soilgrids

earth_search:
  name: Earth Search STAC (Element 84)
  url: https://earth-search.aws.element84.com/v1
  source: https://earth-search.aws.element84.com/v1 ; spike 2026-11-21
  collections:
    # CP2 probe 2026-11-21 (items per year at 52.80N 18.30E):
    #   sentinel-2-l2a    2016:22 2017:77 2018:308 2019:528 2020:589 2021:623 2022:292 2023:290 2024:292 2025:401
    #   sentinel-2-c1-l2a 2016:0  2017:4  2018:82  2019:226 2020:294 2021:292 2022:24  2023:286 2024:292 2025:402
    # -> c1 has large gaps (2017, 2018, 2022); the older collection is complete and is used as primary.
    primary: sentinel-2-l2a      # assets on sentinel-cogs.s3.us-west-2.amazonaws.com
    fallback: sentinel-2-c1-l2a  # assets on e84-earth-search-sentinel-data.s3.us-west-2.amazonaws.com
    dem: cop-dem-glo-30          # asset `data` href is s3://copernicus-dem-30m/... ; https equivalent below
  search:                        # GET /search supports these (CP2 probe 2026-11-21)
    query_param: query           # JSON, e.g. {"eo:cloud_cover":{"lt":60}}
    sortby_param: sortby         # e.g. "+properties.eo:cloud_cover"
    pagination: links rel=next   # GET href with token
    max_cloud_cover_pct: 60      # PART_A_DATA_GEO.md (sentinel2.search_scenes default max_cloud=60)
  duplicates_note: >-
    sentinel-2-l2a lists some acquisitions twice (reprocessed "_1_" next to "_0_" ids, and the same
    acquisition on two overlapping MGRS tiles, e.g. 33UYU and 34UCD). Scenes are de-duplicated by
    s2:datatake_id without its "_Nxx.xx" baseline suffix (same for both tiles and both collections, checked
    2026-11-21; tile datetimes of one datatake differ by up to ~1 s); the higher processing baseline is kept.
  offset_note: >-
    raster:bands declares the PB 04.00 BOA offset per item (probe 2026-11-21: S2A_34UCD_20180715_0_L2A PB 02.08 ->
    offset 0; S2A_33UYU_20220714_0_L2A PB 04.00 and S2B_33UYU_20210714_1_L2A PB 05.00 -> offset -0.1), but the
    pixel values of sentinel-2-l2a do NOT carry the +1000 DN offset. Same acquisition, same parcel interior,
    B04 median DN (CP2 check 2026-11-21):
      2023-05-10 33UXU: sentinel-2-l2a 284, sentinel-2-c1-l2a 1284 (PB 05.09 in both)
      2023-05-10 33UXT: sentinel-2-l2a 282, sentinel-2-c1-l2a 1282
      2021-07-14 33UYU: sentinel-2-l2a 447 (_1_, PB 05.00) / 440 (_0_, PB 03.01), sentinel-2-c1-l2a 1447
      2022-07-14 33UXU sentinel-2-l2a (PB 04.00): B04 964, B08 1742 -> with offset -0.1 red reflectance < 0
    -> sentinel-2-l2a is harmonized to the pre-04.00 scale whatever its metadata says: offset 0 is used.
       sentinel-2-c1-l2a keeps the offset: the item's raster:bands offset (-0.1) is used.
  harmonized_collections: [sentinel-2-l2a]   # offset forced to 0 (evidence above)
  asset_hosts:                   # hosts of the asset hrefs in STAC items (spike 2026-11-21), read via /vsicurl/
    - https://e84-earth-search-sentinel-data.s3.us-west-2.amazonaws.com/
    - https://sentinel-cogs.s3.us-west-2.amazonaws.com/
  assets:                        # asset keys (both collections), spike 2026-11-21
    B04: red
    B08: nir
    B8A: nir08
    B11: swir16
    SCL: scl
  scale_offset_from: "raster:bands (scale, nodata always; offset only outside harmonized_collections)"
  observed_latency_s: 0.4
  licence: Copernicus Sentinel data – free, full and open access
  licence_verified: false
  licence_source: https://sentinels.copernicus.eu/documents/247904/690755/Sentinel_Data_Legal_Notice
  attribution_pl: "Contains modified Copernicus Sentinel data [year]"   # official English wording; no official Polish text known

sentinel2_processing:
  name: Sentinel-2 parcel statistics (Vedra processing parameters)
  source: docs/PART_A_DATA_GEO.md (sentinel2.py / vegetation.py specs); values marked "our choice" are ours
  interior_buffer_m: -10         # PART_A_DATA_GEO.md / contracts geo.py: "parcel buffered -10 m"
  grid_m: 10                     # Sentinel-2 B04/B08 native resolution; B8A/B11/SCL (20 m) resampled nearest
  scl_keep_classes: [4, 5]       # PART_A_DATA_GEO.md: "keep SCL 4/5 only" (vegetation, not-vegetated)
  valid_fraction_min: 0.3        # PART_A_DATA_GEO.md: scene "None if valid fraction < 0.3" - OUR ASSUMPTION
  min_interior_pixels: 20        # PART_A_DATA_GEO.md: "Interior < 20 pixels -> partial + note" - OUR ASSUMPTION
  current_window_max_days: 60    # PART_A_DATA_GEO.md / GeoRequest: "extended by A up to 60 if no clear scene"
  season_months: [4, 8]          # PART_A_DATA_GEO.md: season peaks "Apr-Aug"
  season_max_scenes: 6           # PART_A_DATA_GEO.md: "sample <= 6 least-cloudy scenes per season"
  workers: 16                    # PART_A_DATA_GEO.md: "ThreadPool 16-32"; lower bound because reads are bandwidth-bound
                                 # (24 parallel streams truncated tile reads on the dev link, 2026-11-21)
  same_window_max_scenes: 3      # OUR CHOICE (CP2): least-cloudy scenes per previous-year window. Reason: every clear
                                 # scene costs ~4 MB of COG tiles (10 m bands: 1024x1024 deflate tiles ~1.4 MB,
                                 # blocks checked 2026-11-21 in both collections); all ~10 scenes x 10 years cannot be
                                 # read within the 22 s budget.
  preprocessed_stats_file: data/a/s2_scene_stats.json   # scripts/a/prefetch_s2.py (test parcels x fixture dates)

