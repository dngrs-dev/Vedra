terrain_processing:
  name: Terrain analysis (Vedra processing parameters)
  source: docs/PART_A_DATA_GEO.md (dem.py / terrain.py specs); values marked OUR CHOICE are ours
  dem_buffer_m: 200              # PART_A_DATA_GEO.md: fetch_dem(parcel, buffer_m=200)
  nmt_resolutions_m: [2, 5, 10]  # PART_A_DATA_GEO.md: "resample to 2-5 m by area"; 10 m only for very large parcels
  max_cells: 250000              # OUR CHOICE (compute budget): priority-flood + epsilon fill + D8 took ~6 s for
                                 # 490k cells on the dev machine (2026-11-21), so grids are capped at ~250k cells
  nmt_timeout_s: 120             # OUR CHOICE: background NMT request limit (observed 52-56 s per request)
  copernicus_res_m: 30           # Copernicus GLO-30 native ~30 m (1 arc-second); reprojected to EPSG:2180 at 30 m
  dem_choice: first DEM to arrive (NMT 52-164 s never fits the budget; it replaces Copernicus at the next analysis)
  analysis_s_per_cell: 1.2e-5    # measured: ~6 s for 490k cells (see max_cells) -> time kept for the analysis
  analysis_reserve_min_s: 1.0    # OUR CHOICE: fixed part of that reserve (hydro geometry, contract assembly)
  depression_min_area_m2: 100    # OUR CHOICE: smaller pits are below a practical retention measure
  depression_min_depth_m: 0.1    # OUR CHOICE: ignore fill depths at the level of DEM rounding/noise
  flow_min_upstream_ha: 1.0      # OUR CHOICE: flow lines drawn where >= 1 ha drains through a cell
  max_retention_spots: 15        # OUR CHOICE: report size
  max_flow_lines: 20             # OUR CHOICE: report size
  volume_uncertainty: none       # PART_A_DATA_GEO.md: volume ranges only if DEM vertical accuracy is documented;
                                 # not yet sourced -> volume_m3 low/high = None

bdot10k_water:
  name: BDOT10k (GUGiK) – sieć wodna, usługa WMS
  url: https://mapy.geoportal.gov.pl/wss/service/pub/guest/kompozycja_BDOT10k_WMS/MapServer/WMSServer
  source: >-
    URL from the geoportal WMS/WMTS list (https://www.geoportal.gov.pl/pl/usluga/uslugi-przegladania-wms-i-wmts/);
    layers and attributes from GetCapabilities / GetFeatureInfo, CP3 probe 2026-11-21 (near 52.80N 18.30E:
    "row" 1297 drawn px at 2 m, "WPow" 187 px; others 0). Vector access (ArcGIS REST ?f=json, /query) -> HTTP 401,
    so features are derived from rendered layers (see method).
  wms_version: "1.3.0"
  crs: EPSG:2180                  # WMS 1.3.0 BBOX axis order (northing, easting)
  layers:                         # WMS layer -> contract WaterFeature.kind (mapping: OUR CHOICE, titles from GetCapabilities)
    row: ditch                    # "Rów melioracyjny" (GFI x_kod SWRM..)
    kan: canal                    # "Kanał"
    kanOkr: canal                 # "Kanał okresowy"
    rz: stream                    # "Rzeka lub strumień" - BDOT10k does not split river/stream in this layer
    rzOk: stream                  # "Rzeka lub strumień okresowy"
    WPow: by_rodzaj               # "Woda powierzchniowa" (polygons, x_kod PTWP..), kind from attribute `rodzaj`
  wpow_rodzaj_kind:               # GFI attribute `rodzaj` -> kind (OUR CHOICE)
    wody stojące: pond
    wody płynące: river
  ditch_layers: [row]             # for HydroData.ditches_crossing_boundary
  method: >-
    GetMap PNG (TRANSPARENT=TRUE) per layer over the parcel bbox + buffer; drawn (alpha > 0) pixels, 8-connected,
    form one feature each (a connected ditch network counts as one); outlines via rasterio.features.shapes;
    distances in EPSG:2180. Distances are to the drawn symbol, so they can be short by up to the symbol half-width.
  pixel_m: 2                      # OUR CHOICE: distance resolution 2 m; increased when the image would exceed max_px
  max_px: 4000                    # OUR CHOICE: request size cap (typical ArcGIS WMS limit 4096 px)
  max_feature_info: 20            # OUR CHOICE: GetFeatureInfo calls per parcel (names / rodzaj / x_kod)
  name_attribute: nazwa
  observed_latency_s: 0.4-2.3
  licence_declared: "Fees: Brak opłat (WMS GetCapabilities)"
  resolution: "1:10 000"
  licence_verified: false
  licence_source: https://www.geoportal.gov.pl/

