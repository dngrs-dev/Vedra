edo:
  name: European Drought Observatory (Copernicus EMS)
  wms_url: https://drought.emergency.copernicus.eu/api/wms
  wcs_url: https://drought.emergency.copernicus.eu/api/wcs
  source: https://drought.emergency.copernicus.eu/data/wms-service and /data/wcs-service ; spike 2026-11-21
  wms_version: "1.1.1"
  get_feature_info: unsupported # spike: every layer queryable="0"; GetFeatureInfo -> "Invalid request type"
  wcs:
    version: "2.0.0"
    map_param: DO_WCS
    format: GEOTIFF
    axis_labels: [lat, long]
    subset_note: >-
      SUBSET on `long` is applied, SUBSET on `lat` is ignored (all three spellings tried) -> request a
      0.2 deg longitude strip (~10 kB) and sample the latitude locally.
    value_note: >-
      Returned rasters are uint8 CLASS CODES (e.g. cdiad 0..6, spaST 0..4), not physical values.
      Code -> label mapping must come from GetLegendGraphic / EDO factsheets (to do in CP2).
    time_note: 'WCS page: "If TIME is not set, the last available date is considered". TIME step P10D (days 01, 11, 21).'
  layers:                       # name: title (WMS GetCapabilities spike 2026-11-21)
    cdiad: "Combined Drought Indicator (CDI) v4.1"   # time 2012-01-01/…/P10D ; legend: Watch / Warning / Alert
    cdirc: "No Drought and Recovery CDI v.4"
    smian: "SMI Anomaly"                              # time 1995-01-01/…/P10D (served by WCS though not listed on the WCS page)
    fpanv: "fAPAR Anomaly (VIIRS)"                    # time 2012-01-21/…/P10D (served by WCS though not listed)
    spaST: "SPI ERA5 Short Term"                      # time 1991-01-01/…/P10D ; SELECTED_TIMESCALE=01|03|...
  cdi_coverage: cdiad             # WCS strip 2026-11-01 contained codes 0..6 (all CDI levels, not only 1..3)
  cdi_levels:                     # LEVEL -> label, CDI factsheet v4.1.1 Table 1:
    0: No drought                 # https://drought.emergency.copernicus.eu/data/factsheets/factsheet_combinedDroughtIndicator_v4.pdf
    1: Watch
    2: Warning
    3: Alert
    4: Recovery
    5: Temporary Soil Moisture recovery
    6: Temporary vegetation recovery
  cdi_levels_verification: >-
    Assumption: WCS pixel value = Table 1 LEVEL (7 codes 0..6 seen, 7 levels in Table 1). Partial check 2026-11-21:
    WCS strip vs WMS GetMap colours on the same grid (TIME 2026-11-01, 18.5-18.7E): code 2 -> Warning orange
    (230,159,0) in 390 of 612 px; code 3 -> Alert red (220,5,12) as the most common colour (153 px), orange next
    (115 px); code 1 only 4 px (transparent). Differences come from the two products being resampled from the
    native grid differently.
  dekad_rule: >-
    TIME values are dekads (P10D: days 1, 11, 21). OUR CHOICE: use the latest dekad that has ENDED on or before
    the analysis date (next dekad start - 1 day <= analysis date), so no observation after the analysis date can
    be included whichever day of the dekad the date label refers to.
  observed_latency_s: 1-5
  licence_declared: "Fees: no fees; AccessConstraints: no constraints (WMS GetCapabilities)"
  licence_verified: false
  licence_source: https://drought.emergency.copernicus.eu/terms&conditions/

imgw:
